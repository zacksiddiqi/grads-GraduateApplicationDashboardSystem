<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main_layout}"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Application</title>
</head>
<body>

<div layout:fragment="content">
    <h1 class="h3 mb-4">Edit application</h1>

    <div class="card border-0 shadow-sm" style="max-width: 560px;">
        <div class="card-body">
            <form th:action="@{/applications/{id}/update(id=${app.id})}" method="post">
                <strong><u><span th:text="${app.university.name}"></span></u></strong>
                <div class="mb-3">
                    <label class="form-label">Status: </label>
                    <select name="status" required>
                        <option th:each="s : ${statuses}"
                                th:value="${s}"
                                th:text="${s}"
                                th:selected="${s == app.status}"></option>
                    </select>
                </div><div class="mb-3">
                    <label class="form-label">Deadline: </label>
                    <input type="date" name="deadline" th:value="${app.deadline}" th:min="${today}" class="form-control form-control-sm">
                </div><div class="mb-3">
                    <label class="form-label">Route: </label>
                    <select name="route">
                        <option value="" th:selected="${app.route == null}">-</option>
                        <option th:each="r : ${routes}"
                                th:value="${r}"
                                th:text="${r}"
                                th:selected="${r == app.route}"></option>
                    </select>
                </div><div class="mb-3">
                    <label class="form-label">Fee</label>
                    <input type="number" step="0.01" name="fee" th:value="${app.fee}" class="form-control">
                </div>
                <button type="submit" class="btn">Save</button>
                <a th:href="@{/applications/view}" class="btn">Cancel</a>
            </form>


        </div>


    </div>

</div>

</body>
</html>
