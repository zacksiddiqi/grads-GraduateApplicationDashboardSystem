<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main_layout}"
      lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit University</title>
</head>
<body>



<div layout:fragment="content">
        <h1 class="h3 mb-4">Edit University</h1>

        <div class="card border-0 shadow-sm" style="max-width: 560px;">
            <div class="card-body">
            <form th:action="@{/universities/{id}/update(id=${university.id})}" method="post">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" th:value="${university.name}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Country</label>
                    <input type="text" name="country" th:value="${university.country}" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">City</label>
                    <input type="text" name="city" th:value="${university.city}" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">State</label>
                    <input type="text" name="state" th:value="${university.state}" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Program</label>
                    <input type="text" name="programName" th:value="${university.programName}" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Link</label>
                    <input type="text" name="programUrl" th:value="${university.programUrl}" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Tuition</label>
                    <input type="number" step="0.01" name="tuition" th:value="${university.tuition}" class="form-control">
                </div>

                <button type="submit" class="btn">Save</button>
                <a th:href="@{/universities/view}" class="btn">Cancel</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
