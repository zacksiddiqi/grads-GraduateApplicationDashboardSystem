<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main_layout}"
      lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Welcome!</title>
<!--    <link rel="stylesheet" th:href="@{/css/style.css}">-->
</head>
<body>

<div layout:fragment="content">


<!--        <div th:replace="~{fragments/navbar :: navbar}"></div>-->
        <h1 class="h3 mb-4">Dashboard</h1>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card stat-card bg-indigo">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <div class="small">Universities tracked</div>
                            <div class="fs-2 fw-semibold" th:text="${universityCount}">0</div>
                        </div>
                        <i class="bi bi-building stat-icon"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card bg-teal">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <div class="small">Total applications</div>
                            <div class="fs-2 fw-semibold" th:text="${applicationCount}">0</div>
                        </div>
                        <i class="bi bi-journal-text stat-icon"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card bg-slate">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <div class="small">Upcoming deadlines</div>
                            <div class="fs-2 fw-semibold" th:text="${upcomingDeadlines}">0</div>
                        </div>
                        <i class="bi bi-calendar-event stat-icon"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <h2 class="h5">About</h2>
                <p class="text-secondary mb-0">
                    GRADS keeps your grad school applications organized: deadlines, documents,
                    recommendation letters, and program requirements all in one place.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
