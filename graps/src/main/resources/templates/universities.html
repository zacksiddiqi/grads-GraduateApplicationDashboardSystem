<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main_layout}"
      lang="en">

<head>
    <title>Universities</title>
</head>
<body>



<div layout:fragment="content">
    <h1 class="h3 mb-4">Universities</h1>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Country</th>
                    <th>City</th>
                    <th>State</th>
                    <th>Program</th>
                    <th>Link</th>
                    <th>Tuition (€)</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="uni : ${universities}">
                    <td th:text="${uni.name}"></td>
                    <td th:text="${uni.country}"></td>
                    <td th:text="${uni.city}"></td>
                    <td th:text="${uni.state}"></td>
                    <td th:text="${uni.programName}"></td>
                    <td>
                        <a th:if="${uni.programUrl != null and !uni.programUrl.isEmpty()}"
                           th:href="${uni.programUrl}"
                           target="_blank" rel="noopener noreferrer"
                           class="btn btn-sm btn-outline-primary">Visit</a>
                        <span th:unless="${uni.programUrl != null and !uni.programUrl.isEmpty()}">-</span>
                    </td>
                    <td>€<span th:text="${uni.tuition}"></span></td>
                    <td class="text-end">
                        <a th:href="@{/universities/{id}/edit(id=${uni.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                        <a th:href="@{/universities/{id}/delete(id=${uni.id})}" class="btn btn-sm btn-outline-danger">Delete</a>
                    </td>
                </tr>
                </tbody>
                <tfoot class="table-light">
                <tr>
                    <form th:action="@{/universities/add}" method="post">
                        <td><input type="text" name="name" placeholder="University" class="form-control form-control-sm" required></td>
                        <td><input type="text" name="country" placeholder="Country" class="form-control form-control-sm"></td>
                        <td><input type="text" name="city" placeholder="City" class="form-control form-control-sm"></td>
                        <td><input type="text" name="state" placeholder="State" class="form-control form-control-sm"></td>
                        <td><input type="text" name="programName" placeholder="Program name" class="form-control form-control-sm"></td>
                        <td><input type="text" name="programUrl" placeholder="URL" class="form-control form-control-sm"></td>
                        <td><input type="number" step="0.01" name="tuition" placeholder="Tuition" class="form-control form-control-sm"></td>
                        <td class="text-end"><button type="submit" class="btn btn-sm btn-primary">Add</button></td>
                    </form>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

</body>
</html>
