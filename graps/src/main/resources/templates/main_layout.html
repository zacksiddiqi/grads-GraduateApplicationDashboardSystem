<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE | GRADS">GRADS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div class="d-flex" id="app">

    <!--Sidebar-->
    <nav class="sidebar bg-dark d-flex flex-column">
        <a th:href="@{/}" class="text-white text-decoration-none px-4 py-3 fs-5 fw-semibold">
            <i class="bi bi-mortarboard-fill me-2"></i>GRADS
        </a>
        <hr class="border-secondary my-0">

        <div class="nav-section">Core</div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" th:href="@{/}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/universities/view}"><i class="bi bi-building me-2"></i>Universities</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/applications/view}"><i class="bi bi-journal-text me-2"></i>Applications</a></li>
        </ul>

        <div class="nav-section">Core</div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-check2-square me-2"></i>Requirements</a></li>
            <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-person-lines-fill me-2"></i>Recommenders</a></li>
            <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-folder2-open me-2"></i>Documents</a></li>

        </ul>

        <div class="mt-auto border-top border-secondary">
            <a class="nav-link" href="#"><i class="bi bi-box-arrow-left me-2"></i>Logout</a>
        </div>

    </nav>

    <!-- Main column -->
    <div class="content flex-grow-1">

        <header class="bg-white shadow-sm px-4 py-2 d-flex align-items-center justify-content-between">
            <button class="btn btn-outline-secondary btn-sm" id="sidebarToggle" type="button" aria-label="Toggle sidebar">
                <i class="bi bi-list"></i>
            </button>
            <span class="text-secondary small">Grad Application Dashboard</span>
        </header>

        <main class="p-4">
            <div layout:fragment="content"></div>
        </main>
    </div>
</div>






</body>
</html>
