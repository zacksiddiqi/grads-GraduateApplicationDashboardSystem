<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main_layout}"
      lang="en">


<head>
    <title>University</title>

</head>
<body>


<div layout:fragment="content">
        <a th:href="@{/universities/view}">&larr; Back to Universities</a>
        <h1 class="h3 my-3" th:text="${university.name}"></h1>

        <div class="card border-0 shadow-sm mb-3" style="max-width: 560px;">
            <div class="card-body">
                <p><strong>Country: </strong> <span th:text="${university.country}"></span></p>
                <p><strong>City: </strong> <span th:text="${university.city}"></span></p>
                <p><strong>State: </strong> <span th:text="${university.state}"></span></p>
                <p><strong>Program: </strong> <span th:text="${university.programName}"></span></p>
                <p><strong>Tuition: </strong> <span th:text="${university.tuition}"></span></p>
                <p>
                    <strong>Program Link:</strong>
                    <a th:if="${university.programUrl != null and !university.programUrl.isEmpty()}"
                       th:href="${university.programUrl}"
                       target="blank"
                       rel="noopener noreferrer"
                        th:text="${university.programUrl}"></a>
                    <span th:unless="${university.programUrl != null and !university.programUrl.isEmpty()}">-</span>
                </p>
            </div>
        </div>
        <a th:href="@{/universities/{id}/edit(id=${university.id})}" class="btn btn-primary">Edit</a>


</div>
</body>
</html>
